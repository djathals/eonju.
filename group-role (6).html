<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>모둠 역할 정하기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --surface:#f6f8f7;
    --green:#2f7d5b;
    --green-deep:#256548;
    --green-soft:#e6f2ec;
    --blue:#3a6f95;
    --blue-soft:#e8f1f7;
    --text:#1f2a24;
    --text-soft:#6b7770;
    --line:#e4e9e6;
    --danger:#b3473b;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Noto Sans KR',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .app-shell{
    width:100%;
    max-width:560px;
    margin:0 auto;
    min-height:100vh;
    padding:28px 24px 64px;
  }

  .progress-track{height:4px;background:var(--line);border-radius:4px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--green);border-radius:4px;transition:width .3s ease;}
  .progress-label{font-size:13px;color:var(--text-soft);margin:12px 0 36px;}

  h1.page-title{font-size:24px;font-weight:700;line-height:1.4;margin:0 0 10px;color:var(--text);letter-spacing:-0.01em;}
  p.page-desc{font-size:15px;line-height:1.65;color:var(--text-soft);margin:0 0 32px;}

  .field-block{margin-bottom:16px;}
  .row-input{display:flex;gap:8px;margin-bottom:10px;align-items:center;}
  input[type="text"],input[type="number"],textarea{
    font-family:inherit;font-size:15px;color:var(--text);
    width:100%;height:48px;padding:0 14px;
    background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);outline:none;
    transition:border-color .15s;
  }
  textarea{height:auto;min-height:76px;padding:12px 14px;resize:none;line-height:1.55;}
  input::placeholder,textarea::placeholder{color:#a7b1ab;}
  input[type="text"]:focus,input[type="number"]:focus,textarea:focus{border-color:var(--green);}

  .icon-btn{
    flex:0 0 40px;height:40px;border:none;background:transparent;color:var(--text-soft);
    border-radius:10px;font-size:16px;cursor:pointer;
  }
  .icon-btn:hover{background:var(--surface);color:var(--danger);}

  .add-link{
    background:none;border:none;color:var(--green);font-family:inherit;font-size:15px;font-weight:500;
    padding:8px 0;cursor:pointer;
  }
  .add-link:hover{color:var(--green-deep);}

  .role-card{background:var(--surface);border-radius:14px;padding:16px;margin-bottom:12px;}
  .role-card .row-input{margin-bottom:12px;}
  .role-card input[type="number"]{width:72px;flex:0 0 72px;text-align:center;padding:0 8px;}
  .role-meta-label{font-size:13px;color:var(--text-soft);white-space:nowrap;}
  .role-card .capacity-note{margin:0 0 10px;}

  .tag-grid{display:flex;flex-wrap:wrap;gap:8px;}
  .tag-chip{
    padding:8px 14px;border-radius:999px;font-size:14px;color:var(--text-soft);
    background:var(--bg);border:1px solid var(--line);cursor:pointer;user-select:none;
    transition:background .15s,color .15s,border-color .15s;
  }
  .tag-chip.active{background:var(--green);border-color:var(--green);color:#fff;font-weight:500;}

  .capacity-note{font-size:13px;line-height:1.55;color:var(--text-soft);}
  .capacity-note.error{color:var(--danger);}
  #capacitySummary{margin-top:20px;padding:12px 14px;border-radius:var(--radius);background:var(--green-soft);color:var(--green-deep);}
  #capacitySummary.error{background:#fbeeec;color:var(--danger);}

  .slider-row{margin-bottom:26px;}
  .slider-row label{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:500;margin-bottom:12px;}
  .slider-row .val{
    min-width:32px;text-align:center;padding:3px 10px;border-radius:999px;
    background:var(--blue-soft);color:var(--blue);font-size:14px;font-weight:700;
  }
  input[type="range"]{width:100%;accent-color:var(--blue);margin:0;}
  .scale{display:flex;justify-content:space-between;font-size:12px;color:var(--text-soft);margin-top:4px;}
  .char-count{text-align:right;font-size:12px;color:var(--text-soft);margin-top:6px;}

  .nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:40px;}
  button.btn{font-family:inherit;font-size:16px;font-weight:500;height:50px;padding:0 24px;border-radius:var(--radius);border:none;cursor:pointer;}
  .btn-primary{background:var(--green);color:#fff;flex:1;}
  .btn-primary:hover{background:var(--green-deep);}
  .btn-primary:disabled{background:var(--line);color:#a7b1ab;cursor:not-allowed;}
  .btn-ghost{background:var(--surface);color:var(--text-soft);}
  .btn-ghost:hover{color:var(--text);}
  .btn-block{width:100%;}

  .intro-hero{padding:24px 0 8px;}
  .intro-hero h1.page-title{font-size:30px;margin-bottom:12px;}
  .intro-hero p.page-desc{margin-bottom:28px;}
  .intro-steps{list-style:none;padding:0;margin:0 0 36px;display:grid;gap:14px;}
  .intro-steps li{display:flex;align-items:center;gap:12px;font-size:15px;color:var(--text);}
  .intro-steps li b{
    width:26px;height:26px;border-radius:50%;background:var(--green-soft);color:var(--green-deep);
    display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;
  }

  .result-card{background:var(--surface);border-radius:14px;padding:18px;margin-bottom:12px;}
  .result-card .name{font-size:17px;font-weight:700;margin-bottom:8px;}
  .result-card .role{
    display:inline-block;padding:4px 12px;border-radius:999px;background:var(--blue-soft);color:var(--blue);
    font-size:13.5px;font-weight:700;margin-bottom:12px;
  }
  .result-card .reason{font-size:14.5px;line-height:1.7;color:var(--text);}

  .overlay{position:fixed;inset:0;background:rgba(31,42,36,.4);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;}
  .modal{background:var(--bg);border-radius:16px;max-width:420px;width:100%;padding:24px;}
  .modal h2{font-size:19px;font-weight:700;margin:0 0 8px;}
  .modal p{font-size:14px;color:var(--text-soft);margin:0 0 18px;line-height:1.6;}
  .tie-option{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:var(--radius);padding:13px 14px;margin-bottom:8px;cursor:pointer;border:1px solid transparent;}
  .tie-option.selected{border-color:var(--blue);background:var(--blue-soft);}
  .tie-option .score{margin-left:auto;font-size:13px;color:var(--text-soft);}
</style>
</head>
<body>
<div class="app-shell" id="app"></div>

<script>
const TRAITS = ["꼼꼼함", "활발함", "리더십", "창의성", "배려심", "책임감"];

const state = {
  page: "intro",
  names: ["", ""],
  roles: [ { name: "", capacity: 1, tags: [] } ],
  studentData: {},
  studentIdx: 0,
  assignments: {},
};

const app = document.getElementById("app");

function esc(s){
  const d = document.createElement("div");
  d.innerText = s;
  return d.innerHTML;
}

function totalSteps(){ return 3 + state.names.filter(n=>n.trim()).length; }
function currentStepNumber(){
  if(state.page==="intro") return 0;
  if(state.page==="names") return 1;
  if(state.page==="roles") return 2;
  if(state.page==="student") return 3 + state.studentIdx;
  if(state.page==="result") return totalSteps();
  return 0;
}
function progressBar(label){
  const pct = state.page==="intro" ? 0 : Math.round((currentStepNumber()/totalSteps())*100);
  return `<div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
  <div class="progress-label">${label}</div>`;
}

/* ---------------- INTRO ---------------- */
function renderIntro(){
  app.innerHTML = `
    <div class="intro-hero">
      <h1 class="page-title">모둠 역할 정하기</h1>
      <p class="page-desc">팀원 이름과 성향을 입력하면, 각자에게 어울리는 역할을 찾아드려요.</p>
      <ul class="intro-steps">
        <li><b>1</b> 팀원 이름 입력하기</li>
        <li><b>2</b> 필요한 역할과 인원 정하기</li>
        <li><b>3</b> 팀원별 성향 점수 매기기</li>
        <li><b>4</b> 역할 배정 결과 확인하기</li>
      </ul>
    </div>
    <button class="btn btn-primary btn-block" onclick="goNames()">시작하기</button>
  `;
}
function goNames(){ state.page = "names"; render(); }

/* ---------------- NAMES ---------------- */
function renderNames(){
  const rows = state.names.map((n,i)=>`
    <div class="row-input">
      <input type="text" value="${esc(n)}" placeholder="예: 김민준" oninput="updateName(${i}, this.value)">
      ${state.names.length>2 ? `<button class="icon-btn" onclick="removeName(${i})">✕</button>` : ""}
    </div>
  `).join("");
  app.innerHTML = `
    ${progressBar("1단계 · 팀원 이름 입력")}
    <h1 class="page-title">모둠 팀원은 누구인가요?</h1>
    <p class="page-desc">최소 2명 이상, 함께 활동하는 팀원의 이름을 모두 입력해주세요.</p>
    <div class="field-block">${rows}</div>
    <button class="add-link" onclick="addName()">＋ 팀원 추가</button>
    <div class="nav-row">
      <button class="btn btn-ghost" onclick="goIntro()">이전</button>
      <button class="btn btn-primary" id="namesNext" onclick="goRoles()">다음</button>
    </div>
  `;
  validateNames();
}
function goIntro(){ state.page="intro"; render(); }
function updateName(i, v){ state.names[i] = v; validateNames(); }
function addName(){ state.names.push(""); render(); }
function removeName(i){ state.names.splice(i,1); render(); }
function validateNames(){
  const valid = state.names.filter(n=>n.trim()).length >= 2 &&
                new Set(state.names.map(n=>n.trim()).filter(Boolean)).size === state.names.filter(n=>n.trim()).length;
  const btn = document.getElementById("namesNext");
  if(btn) btn.disabled = !valid;
}
function goRoles(){
  state.names = state.names.map(n=>n.trim()).filter(Boolean);
  state.page = "roles";
  render();
}

/* ---------------- ROLES ---------------- */
function renderRoles(){
  const totalCap = state.roles.reduce((s,r)=>s + (parseInt(r.capacity)||0), 0);
  const target = state.names.length;
  const mismatch = totalCap !== target;

  const cards = state.roles.map((r,i)=>{
    const tagChips = TRAITS.map(t=>{
      const active = r.tags.includes(t);
      return `<label class="tag-chip ${active?"active":""}" onclick="toggleTag(${i}, '${t}')">${t}</label>`;
    }).join("");
    return `
    <div class="role-card">
      <div class="row-input">
        <input type="text" value="${esc(r.name)}" placeholder="예: 팀장, 기록이, 발표자" oninput="updateRole(${i}, 'name', this.value)">
        <span class="role-meta-label">인원</span>
        <input type="number" min="1" value="${r.capacity}" oninput="updateRole(${i}, 'capacity', this.value)">
        ${state.roles.length>1 ? `<button class="icon-btn" onclick="removeRole(${i})">✕</button>` : ""}
      </div>
      <div class="capacity-note">이 역할에 어울리는 성향을 골라주세요 (1개 이상)</div>
      <div class="tag-grid">${tagChips}</div>
    </div>`;
  }).join("");

  app.innerHTML = `
    ${progressBar("2단계 · 역할 정하기")}
    <h1 class="page-title">어떤 역할이 필요한가요?</h1>
    <p class="page-desc">역할 이름과 필요한 인원 수를 정하고, 그 역할에 어울리는 성향을 체크해주세요.</p>
    <div class="field-block">${cards}</div>
    <button class="add-link" onclick="addRole()">＋ 역할 추가</button>
    <div class="capacity-note" id="capacitySummary" style="margin-top:14px;"></div>
    <div class="nav-row">
      <button class="btn btn-ghost" onclick="goNames()">이전</button>
      <button class="btn btn-primary" id="rolesNext" onclick="goFirstStudent()">다음</button>
    </div>
  `;
  refreshRolesFooter();
}
function refreshRolesFooter(){
  const totalCap = state.roles.reduce((s,r)=>s + (parseInt(r.capacity)||0), 0);
  const target = state.names.length;
  const mismatch = totalCap !== target;
  const summary = document.getElementById("capacitySummary");
  if(summary){
    summary.classList.toggle("error", mismatch);
    summary.innerHTML = `현재 역할 인원 합계: ${totalCap}명 · 팀원 수: ${target}명`
      + (mismatch ? " — 두 숫자가 같아야 다음으로 넘어갈 수 있어요." : " ✓ 인원 수가 딱 맞아요.");
  }
  const btn = document.getElementById("rolesNext");
  if(btn){
    const valid = !mismatch && state.roles.every(r=>r.name.trim() && r.tags.length>0);
    btn.disabled = !valid;
  }
}
function updateRole(i, field, v){
  state.roles[i][field] = field==="capacity" ? v.replace(/[^0-9]/g,"") : v;
  refreshRolesFooter();
}
function toggleTag(i, tag){
  const tags = state.roles[i].tags;
  const idx = tags.indexOf(tag);
  if(idx>-1) tags.splice(idx,1); else tags.push(tag);
  render();
}
function addRole(){ state.roles.push({name:"", capacity:1, tags:[]}); render(); }
function removeRole(i){ state.roles.splice(i,1); render(); }

function goFirstStudent(){
  state.names.forEach(n=>{
    if(!state.studentData[n]){
      const scores = {};
      TRAITS.forEach(t=>scores[t]=5);
      state.studentData[n] = { scores, custom: "" };
    }
  });
  state.studentIdx = 0;
  state.page = "student";
  render();
}

/* ---------------- STUDENT TRAITS ---------------- */
function renderStudent(){
  const name = state.names[state.studentIdx];
  const data = state.studentData[name];
  const sliders = TRAITS.map(t=>`
    <div class="slider-row">
      <label>${t} <span class="val" id="val-${t}">${data.scores[t]}</span></label>
      <input type="range" min="1" max="10" value="${data.scores[t]}"
        oninput="updateScore('${t}', this.value)">
      <div class="scale"><span>1</span><span>10</span></div>
    </div>
  `).join("");

  app.innerHTML = `
    ${progressBar(`3단계 · 성향 입력 (${state.studentIdx+1}/${state.names.length}명)`)}
    <h1 class="page-title">${esc(name)}님은 어떤 성향인가요?</h1>
    <p class="page-desc">아래 항목마다 ${esc(name)}님에게 얼마나 해당하는지 1~10점으로 표시해주세요.</p>
    <div class="field-block">${sliders}</div>
    <div class="field-block">
      <label style="font-size:14.5px; display:block; margin-bottom:8px;">그 외에 이 팀원을 표현할 특징이 있다면 적어주세요 (선택)</label>
      <textarea maxlength="100" oninput="updateCustom(this.value)" placeholder="예: 그림을 잘 그린다, 시간 약속을 잘 지킨다">${esc(data.custom)}</textarea>
      <div class="char-count" id="charCount">${data.custom.length}/100</div>
    </div>
    <div class="nav-row">
      <button class="btn btn-ghost" onclick="prevStudent()">이전</button>
      <button class="btn btn-primary" onclick="nextStudent()">${state.studentIdx===state.names.length-1 ? "결과 보기" : "다음"}</button>
    </div>
  `;
}
function updateScore(trait, v){
  const name = state.names[state.studentIdx];
  state.studentData[name].scores[trait] = parseInt(v);
  document.getElementById(`val-${trait}`).innerText = v;
}
function updateCustom(v){
  const name = state.names[state.studentIdx];
  state.studentData[name].custom = v;
  document.getElementById("charCount").innerText = `${v.length}/100`;
}
function prevStudent(){
  if(state.studentIdx===0){ state.page="roles"; render(); }
  else { state.studentIdx--; render(); }
}
function nextStudent(){
  if(state.studentIdx < state.names.length-1){
    state.studentIdx++;
    render();
  } else {
    startCalculation();
  }
}

/* ---------------- MATCHING ---------------- */
let calc = null;

function computeScore(name, role){
  const data = state.studentData[name];
  return role.tags.reduce((sum,t)=> sum + (data.scores[t]||0), 0);
}

function startCalculation(){
  calc = { roleIdx: 0, remaining: [...state.names], assignments: {} };
  runCalcStep();
}

function runCalcStep(){
  if(calc.roleIdx >= state.roles.length){
    finishCalc();
    return;
  }
  const role = state.roles[calc.roleIdx];
  const capacity = parseInt(role.capacity) || 0;
  if(capacity<=0 || calc.remaining.length===0){
    calc.roleIdx++; runCalcStep(); return;
  }
  const scored = calc.remaining.map(n=>({ name:n, score: computeScore(n, role) }));
  scored.sort((a,b)=> b.score - a.score);

  if(scored.length <= capacity){
    scored.forEach(o=> calc.assignments[o.name] = role.name);
    calc.remaining = [];
    calc.roleIdx++; runCalcStep(); return;
  }

  const cutoffScore = scored[capacity-1].score;
  const guaranteed = scored.filter(o=> o.score > cutoffScore);
  const atCutoff = scored.filter(o=> o.score === cutoffScore);
  const needed = capacity - guaranteed.length;

  guaranteed.forEach(o=> calc.assignments[o.name] = role.name);
  calc.remaining = calc.remaining.filter(n=> !guaranteed.some(o=>o.name===n));

  if(needed <= 0){
    calc.roleIdx++; runCalcStep(); return;
  }
  if(needed >= atCutoff.length){
    atCutoff.forEach(o=> calc.assignments[o.name] = role.name);
    calc.remaining = calc.remaining.filter(n=> !atCutoff.some(o=>o.name===n));
    calc.roleIdx++; runCalcStep(); return;
  }

  showTieModal(role, atCutoff, needed);
}

function showTieModal(role, candidates, needed){
  const selected = new Set();
  const renderModal = ()=>{
    const options = candidates.map(c=>`
      <div class="tie-option ${selected.has(c.name)?"selected":""}" onclick="tieToggle('${c.name}')">
        <input type="checkbox" ${selected.has(c.name)?"checked":""} readonly>
        <span>${esc(c.name)}</span>
        <span class="score">${c.score}점</span>
      </div>
    `).join("");
    const overlay = document.getElementById("tieOverlay");
    overlay.querySelector(".modal").innerHTML = `
      <h2>동점이 나왔어요</h2>
      <p>'${esc(role.name)}' 역할의 마지막 ${needed}자리를 두고 아래 팀원들의 점수가 같아요. 직접 ${needed}명을 선택해주세요.</p>
      ${options}
      <button class="btn btn-primary btn-block" style="margin-top:14px;" id="tieConfirm" onclick="confirmTie()" ${selected.size!==needed?"disabled":""}>선택 완료 (${selected.size}/${needed})</button>
    `;
  };
  window.tieToggle = (name)=>{
    if(selected.has(name)) selected.delete(name);
    else if(selected.size < needed) selected.add(name);
    renderModal();
  };
  window.confirmTie = ()=>{
    const chosen = [...selected];
    chosen.forEach(n=> calc.assignments[n] = role.name);
    calc.remaining = calc.remaining.filter(n=> !chosen.includes(n));
    document.getElementById("tieOverlay").remove();
    calc.roleIdx++;
    runCalcStep();
  };
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.id = "tieOverlay";
  overlay.innerHTML = `<div class="modal"></div>`;
  document.body.appendChild(overlay);
  renderModal();
}

function finishCalc(){
  if(calc.remaining.length>0){
    state.roles.forEach(role=>{
      const used = Object.values(calc.assignments).filter(r=>r===role.name).length;
      let open = (parseInt(role.capacity)||0) - used;
      while(open>0 && calc.remaining.length>0){
        const n = calc.remaining.shift();
        calc.assignments[n] = role.name;
        open--;
      }
    });
  }
  state.assignments = calc.assignments;
  state.page = "result";
  render();
}

/* ---------------- RESULT ---------------- */
function generateReason(name, roleName){
  const role = state.roles.find(r=>r.name===roleName);
  const data = state.studentData[name];
  const ranked = role.tags.map(t=>({t, v:data.scores[t]||0})).sort((a,b)=>b.v-a.v);
  const top = ranked.slice(0,2).map(o=>o.t);
  const topLabel = top.length>1 ? `'${top[0]}'과 '${top[1]}'` : `'${top[0]}'`;
  let extra = "";
  if(data.custom && data.custom.trim()){
    extra = ` "${esc(data.custom.trim())}"라는 점도 이 역할과 잘 어울려요.`;
  }
  return `${esc(name)}님은 ${topLabel} 성향 점수가 높게 나와 '${esc(roleName)}' 역할에 가장 잘 어울려요.${extra ? extra : ` 이 성향은 모둠에서 ${esc(roleName)} 역할을 맡았을 때 큰 도움이 될 거예요.`}`;
}

function renderResult(){
  const cards = state.names.map(name=>{
    const roleName = state.assignments[name] || "미배정";
    const reason = state.assignments[name] ? generateReason(name, roleName) : "배정 가능한 역할을 찾지 못했어요. 역할 인원 수를 다시 확인해주세요.";
    return `
      <div class="result-card">
        <div class="name">${esc(name)}</div>
        <div class="role">${esc(roleName)}</div>
        <div class="reason">${reason}</div>
      </div>
    `;
  }).join("");

  app.innerHTML = `
    ${progressBar("4단계 · 역할 배정 결과")}
    <h1 class="page-title">이렇게 역할을 나눠봤어요</h1>
    <p class="page-desc">결과가 마음에 들지 않으면 이전 단계로 돌아가 성향 점수나 역할을 다시 조정해보세요.</p>
    <div class="field-block">${cards}</div>
    <div class="nav-row">
      <button class="btn btn-ghost" onclick="restart()">처음부터 다시</button>
      <button class="btn btn-primary" onclick="backToStudents()">성향 다시 입력</button>
    </div>
  `;
}
function backToStudents(){ state.studentIdx = 0; state.page = "student"; render(); }
function restart(){
  state.page = "intro";
  state.names = ["",""];
  state.roles = [{name:"", capacity:1, tags:[]}];
  state.studentData = {};
  state.studentIdx = 0;
  state.assignments = {};
  render();
}

/* ---------------- ROUTER ---------------- */
function render(){
  if(state.page==="intro") renderIntro();
  else if(state.page==="names") renderNames();
  else if(state.page==="roles") renderRoles();
  else if(state.page==="student") renderStudent();
  else if(state.page==="result") renderResult();
}
render();
</script>
</body>
</html>
